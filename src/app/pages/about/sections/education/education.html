<section class="border-t border-white/10" appScrollReveal>
  <div class="mx-auto max-w-6xl px-6 py-24">
    <div class="grid gap-10 md:grid-cols-[180px_1fr] md:gap-16">
      <!-- Section heading -->
      <div>
        <p class="text-sm font-semibold uppercase tracking-widest text-indigo-400">Education</p>
      </div>

      <!-- Education list -->
      <div class="space-y-12">
        @for (education of educationList; track education.degree) {
          <article>
            <!-- Header -->
            <div class="flex flex-col gap-2 sm:flex-row sm:items-baseline sm:justify-between">
              <div>
                <h2 class="font-heading text-2xl font-bold tracking-tight text-white">
                  {{ education.degree }}
                </h2>

                <p class="mt-1 text-sm text-zinc-500">
                  {{ education.institution }} · {{ education.level }}
                </p>
              </div>

              <p class="text-sm text-zinc-500">
                {{ education.period }}
              </p>
            </div>

            <!-- Description -->
            @if (education.description) {
              <p class="mt-6 max-w-2xl text-base leading-7 text-zinc-400">
                {{ education.description }}
              </p>
            }
          </article>
        }
      </div>
    </div>
  </div>
</section>
