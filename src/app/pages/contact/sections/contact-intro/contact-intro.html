<section>
  <div class="mx-auto max-w-6xl px-6 pb-16 pt-32 sm:pb-20 sm:pt-36">
    <div class="grid grid-cols-1 items-center gap-8 lg:grid-cols-[1.4fr_1fr] lg:gap-12">
      <!-- Introduction -->
      <div class="max-w-3xl space-y-5">
        <p class="text-sm font-semibold uppercase tracking-widest text-indigo-400">Contact</p>

        <h1
          class="font-heading text-4xl font-bold tracking-tight text-white md:text-5xl lg:text-6xl"
        >
          Let's talk about your
          <span class="text-indigo-400">next idea.</span>
        </h1>

        <p class="max-w-2xl text-base leading-8 text-zinc-400 sm:text-lg">
          I'm open to junior developer opportunities, internships, and meaningful collaborations.
          Have an opportunity or want to connect? I'd love to hear from you.
        </p>
      </div>

      <!-- Email CTA -->
      <a
        href="mailto:mannyivfouy@gmail.com"
        class="group flex min-h-52 flex-col justify-between rounded-2xl border border-white/10 bg-zinc-900 p-6 transition-all duration-300 hover:border-indigo-500/50 hover:bg-zinc-900/80"
      >
        <div class="flex items-center justify-between">
          <div class="rounded-xl bg-indigo-500/10 p-3 text-indigo-400">
            <lucide-icon [img]="Mail" [size]="24"></lucide-icon>
          </div>

          <lucide-icon
            [img]="ArrowUpRight"
            [size]="22"
            class="text-zinc-500 transition-transform duration-300 group-hover:-translate-y-1 group-hover:translate-x-1 group-hover:text-indigo-400"
          ></lucide-icon>
        </div>

        <div class="space-y-2">
          <p class="text-xs font-medium tracking-widest text-zinc-500">HAVE AN OPPORTUNITY?</p>

          <h2 class="font-heading text-xl font-semibold text-white">Let's get in touch.</h2>

          <p class="text-sm text-indigo-400">Send me an email</p>
        </div>
      </a>
    </div>
  </div>
</section>
