<section appScrollReveal>
  <div class="mx-auto max-w-6xl px-6 pb-24">
    <!-- Section Heading -->
    <div class="mb-8">
      <p class="text-sm font-semibold uppercase tracking-widest text-indigo-400">Connect</p>

      <h2 class="mt-3 font-heading text-2xl font-bold tracking-tight text-white sm:text-3xl">
        Find me online.
      </h2>

      <p class="mt-3 max-w-xl text-base leading-8 text-zinc-400">
        Explore my work, follow my projects, or connect with me professionally.
      </p>
    </div>

    <!-- Social Links -->
    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
      <!-- GitHub -->
      <a
        href="https://github.com/mannyivfouy"
        target="_blank"
        rel="noopener noreferrer"
        class="group rounded-2xl border border-white/10 bg-zinc-900 p-6 transition-all duration-300 hover:border-indigo-500/50 hover:bg-zinc-900/80"
      >
        <div class="flex items-center justify-between">
          <lucide-icon [img]="Github" [size]="28"></lucide-icon>

          <lucide-icon
            [img]="ArrowUpRight"
            [size]="20"
            class="text-zinc-500 transition-transform duration-300 group-hover:-translate-y-1 group-hover:translate-x-1 group-hover:text-indigo-400"
          ></lucide-icon>
        </div>

        <div class="mt-10 space-y-2">
          <h3 class="font-heading text-xl font-semibold text-white">GitHub</h3>

          <p class="text-sm leading-6 text-zinc-400">Explore my projects and source code.</p>

          <p class="pt-2 text-sm font-medium text-indigo-400">github.com/mannyivfouy</p>
        </div>
      </a>

      <!-- LinkedIn -->
      <a
        href="https://www.linkedin.com/in/mann-yivfouy-baa2a9387/"
        target="_blank"
        rel="noopener noreferrer"
        class="group rounded-2xl border border-white/10 bg-zinc-900 p-6 transition-all duration-300 hover:border-indigo-500/50 hover:bg-zinc-900/80"
      >
        <div class="flex items-center justify-between">
          <lucide-icon [img]="Linkedin" [size]="28"></lucide-icon>

          <lucide-icon
            [img]="ArrowUpRight"
            [size]="20"
            class="text-zinc-500 transition-transform duration-300 group-hover:-translate-y-1 group-hover:translate-x-1 group-hover:text-indigo-400"
          ></lucide-icon>
        </div>

        <div class="mt-10 space-y-2">
          <h3 class="font-heading text-xl font-semibold text-white">LinkedIn</h3>

          <p class="text-sm leading-6 text-zinc-400">
            Connect with me and explore my professional background.
          </p>

          <p class="pt-2 text-sm font-medium text-indigo-400">LinkedIn Profile</p>
        </div>
      </a>
    </div>
  </div>
</section>
