<section class="border-t border-white/10">
  <div class="mx-auto max-w-6xl px-6 py-24">
    <div
      class="relative overflow-hidden rounded-2xl border border-white/10 bg-white/3 px-6 py-16 text-center sm:px-12 sm:py-20"
    >
      <!-- Subtle background glow -->
      <div
        class="pointer-events-none absolute left-1/2 top-1/2 -z-10 h-72 w-72 -translate-x-1/2 -translate-y-1/2 rounded-full bg-indigo-600/10 blur-3xl"
      ></div>

      <div class="mx-auto max-w-2xl">
        <p
          class="text-sm font-semibold uppercase tracking-widest text-indigo-400"
        >
          Let's Work Together
        </p>

        <h2
          class="mt-3 font-heading text-3xl font-bold tracking-tight text-white sm:text-4xl lg:text-5xl"
        >
          Have a project or opportunity in mind?
        </h2>

        <p class="mx-auto mt-5 max-w-xl text-base leading-7 text-zinc-400">
          I'm currently open to junior developer and internship opportunities.
          Feel free to reach out if you'd like to work together or have an
          opportunity to discuss.
        </p>

        <a
          routerLink="/contact"
          class="cursor-pointer group mt-8 inline-flex items-center gap-2 rounded-lg bg-indigo-600 px-5 py-3 text-sm font-semibold text-white transition-colors hover:bg-indigo-500"
        >
          Get In Touch

          <lucide-icon
            [img]="ArrowRight"
            [size]="16"
            class="transition-transform duration-200 group-hover:translate-x-1"
          ></lucide-icon>
        </a>
      </div>
    </div>
  </div>
</section>
