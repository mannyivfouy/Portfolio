<section class="border-t border-white/10">
  <div class="mx-auto max-w-6xl px-6 py-24">

    <!-- Section Header -->
    <div class="max-w-2xl">
      <p
        class="text-sm font-semibold uppercase tracking-widest text-indigo-400"
      >
        Tech Stack
      </p>

      <h2
        class="mt-3 font-heading text-3xl font-bold tracking-tight text-white sm:text-4xl"
      >
        Technologies I work with
      </h2>

      <p class="mt-4 text-base leading-7 text-zinc-400">
        The technologies and tools I use to build modern web applications.
      </p>
    </div>

    <!-- Categories -->
    <div class="mt-12 grid gap-x-12 gap-y-10 md:grid-cols-2">
      @for (category of categories; track category.title) {
        <div>
          <!-- Category Title -->
          <h3
            class="font-heading text-sm font-semibold uppercase tracking-wider text-zinc-300"
          >
            {{ category.title }}
          </h3>

          <!-- Technology Pills -->
          <div class="mt-4 flex flex-wrap gap-3">
            @for (technology of category.technologies; track technology.name) {
              <div
                class="inline-flex items-center gap-2.5 rounded-lg border border-white/10 bg-white/3 px-4 py-2.5"
              >
                <img
                  [src]="technology.icon"
                  [alt]="technology.name"
                  class="h-5 w-5 object-contain"
                />

                <span class="text-sm font-medium text-zinc-300">
                  {{ technology.name }}
                </span>
              </div>
            }
          </div>
        </div>
      }
    </div>

  </div>
</section>
