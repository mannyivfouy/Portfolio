<main class="flex min-h-screen items-center justify-center bg-[#09090b] px-6 text-center">
  <div class="mx-auto max-w-md">
    <!-- Icon -->
    <div
      class="mx-auto mb-8 flex h-20 w-20 items-center justify-center rounded-2xl border border-indigo-500/30 bg-indigo-500/10"
    >
      <lucide-icon [img]="FolderSearch" [size]="36" class="text-indigo-400" />
    </div>

    <!-- Content -->
    <p class="mb-3 text-sm font-semibold uppercase tracking-widest text-indigo-400">404 Error</p>

    <h1 class="mb-4 font-heading text-3xl font-bold text-white">Project Not Found</h1>

    <p class="mb-8 text-sm leading-7 text-zinc-400">
      Oops! The project you're looking for doesn't exist or may have been moved.
    </p>

    <!-- Back Button -->
    <a
      routerLink="/projects"
      class="cursor-pointer inline-flex items-center gap-2 rounded-lg bg-indigo-500 px-5 py-3 text-sm font-semibold text-white transition-all duration-300 hover:bg-indigo-400"
    >
      <lucide-icon [img]="ArrowLeft" [size]="18" />
      Back to Projects
    </a>
  </div>
</main>
