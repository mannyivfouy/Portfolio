<section class="border-t border-white/10">
  <div class="mx-auto max-w-6xl px-6 py-20 sm:py-24">
    <div class="space-y-24">
      @for (project of projects(); track project.slug; let i = $index) {
        <article appScrollReveal class="grid items-center gap-10 md:grid-cols-2 md:gap-16">
          <!-- Project Image -->
          <div [class.md:order-2]="i % 2 !== 0">
            <img
              [src]="project.image"
              [alt]="project.title"
              class="aspect-video w-full rounded-xl border border-white/10 object-cover"
            />
          </div>

          <!-- Project Details -->
          <div [class.md:order-1]="i % 2 !== 0">
            <!-- Category + Project Status -->
            <div class="flex items-center justify-between gap-4">
              <p class="text-sm font-semibold uppercase tracking-widest text-indigo-400">
                {{ project.category }}
              </p>

              @if (project.status; as status) {
                <span
                  class="inline-flex shrink-0 items-center gap-2 text-xs font-medium"
                  [ngClass]="{
                    'text-emerald-400': status === 'Completed',
                    'text-blue-400': status === 'In Progress',
                    'text-zinc-400': status === 'On Hold',
                  }"
                >
                  <span
                    class="h-1.5 w-1.5 rounded-full"
                    [ngClass]="{
                      'bg-emerald-400': status === 'Completed',
                      'bg-blue-400': status === 'In Progress',
                      'bg-zinc-400': status === 'On Hold',
                    }"
                  ></span>

                  {{ status }}
                </span>
              }
            </div>

            <h2 class="mt-4 font-heading text-2xl font-bold tracking-tight text-white sm:text-3xl">
              {{ project.title }}
            </h2>

            <p class="mt-5 text-base leading-7 text-zinc-400">
              {{ project.description }}
            </p>

            <!-- Technologies -->
            <div class="mt-6 flex flex-wrap gap-2">
              @for (tech of project.technologies; track tech) {
                <span
                  class="rounded-md border border-white/10 bg-white/5 px-3 py-1.5 text-xs font-medium text-zinc-300"
                >
                  {{ tech }}
                </span>
              }
            </div>

            <!-- Case Study Link -->
            <a
              [routerLink]="['/project', project.slug]"
              class="group mt-8 inline-flex items-center gap-2 text-sm font-semibold text-white"
            >
              View Case Study
              <span class="transition-transform group-hover:translate-x-1"> → </span>
            </a>
          </div>
        </article>
      }
    </div>
  </div>
</section>
