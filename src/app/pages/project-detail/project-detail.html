@if (project; as detail) {
  <main class="min-h-screen bg-[#09090b] text-zinc-100">
    <div class="mx-auto max-w-6xl px-6 py-20">
      <!-- Project Header -->
      <app-project-detail-header [title]="detail.title" [overview]="detail.overview" />

      <!-- Project Gallery -->
      <app-project-detail-gallery [screenshots]="detail.screenshots" />

      <!-- Project Purpose -->
      <app-project-detail-purpose [purpose]="detail.purpose" />

      <!-- Key Features -->
      <app-project-detail-features [features]="detail.features" />

      <!-- Technology Stack -->
      <app-project-detail-tech-stack [technologies]="detail.technologies" />

      <!-- Implementation Highlights -->
      @if (detail.implementationHighlights; as highlights) {
        @if (highlights.length) {
          <app-project-detail-highlights [highlights]="highlights" />
        }
      }

      <!-- What I Learned -->
      <app-project-detail-learnings [learnings]="detail.learnings" />

      <!-- Project Navigation -->
      <footer class="border-t border-white/10 pt-8">
        <a
          routerLink="/projects"
          class="inline-flex cursor-pointer items-center gap-2 text-sm font-medium text-indigo-400 transition hover:text-indigo-300"
        >
          <lucide-icon [img]="ArrowLeft" [size]="16"></lucide-icon>
          Back to All Projects
        </a>
      </footer>
    </div>
  </main>
} @else {
  <app-not-found />
}
