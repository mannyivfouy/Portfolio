@if (screenshots().length > 0) {
  <section appScrollReveal class="mb-20">
    <p class="mb-3 text-sm font-semibold uppercase tracking-widest text-indigo-400">
      Project Gallery
    </p>

    <!-- Main Image -->
    <div class="group relative overflow-hidden rounded-2xl border border-white/10 bg-[#111113]">
      <img
        [src]="screenshots()[selectedScreenshotIndex]"
        [alt]="'Project screenshot ' + (selectedScreenshotIndex + 1)"
        class="aspect-video w-full object-contain transition-opacity duration-300"
      />

      <!-- Image Counter -->
      <div
        class="absolute bottom-4 right-4 rounded-full bg-black/60 px-3 py-1.5 text-xs text-white backdrop-blur-sm"
      >
        {{ selectedScreenshotIndex + 1 }} / {{ screenshots().length }}
      </div>

      <!-- Navigation Arrows -->
      @if (screenshots().length > 1) {
        <button
          type="button"
          (click)="previousScreenshot()"
          aria-label="Previous screenshot"
          class="absolute left-4 top-1/2 flex size-11 -translate-y-1/2 cursor-pointer items-center justify-center rounded-full border border-white/10 bg-black/60 text-white backdrop-blur-sm transition hover:bg-indigo-600"
        >
          <lucide-icon [img]="ChevronLeft" [size]="22"></lucide-icon>
        </button>

        <button
          type="button"
          (click)="nextScreenshot()"
          aria-label="Next screenshot"
          class="absolute right-4 top-1/2 flex size-11 -translate-y-1/2 cursor-pointer items-center justify-center rounded-full border border-white/10 bg-black/60 text-white backdrop-blur-sm transition hover:bg-indigo-600"
        >
          <lucide-icon [img]="ChevronRight" [size]="22"></lucide-icon>
        </button>
      }
    </div>

    <!-- Thumbnail Gallery -->
    @if (screenshots().length > 1) {
      <div class="mt-4 flex gap-3 overflow-x-auto pb-3">
        @for (screenshot of screenshots(); track $index) {
          <button
            type="button"
            (click)="selectScreenshot($index)"
            [attr.aria-label]="'Show screenshot ' + ($index + 1)"
            [attr.aria-pressed]="selectedScreenshotIndex === $index"
            class="shrink-0 cursor-pointer overflow-hidden rounded-lg border-2 transition duration-300"
            [class.border-indigo-500]="selectedScreenshotIndex === $index"
            [class.border-white/10]="selectedScreenshotIndex !== $index"
            [class.opacity-100]="selectedScreenshotIndex === $index"
            [class.opacity-50]="selectedScreenshotIndex !== $index"
          >
            <img
              [src]="screenshot"
              [alt]="'Project thumbnail ' + ($index + 1)"
              class="h-20 w-32 object-cover transition duration-300 hover:opacity-100"
            />
          </button>
        }
      </div>
    }
  </section>
}
