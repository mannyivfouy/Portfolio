<section class="mb-20">
  <!-- Section Label -->
  <p class="mb-3 text-sm font-semibold uppercase tracking-widest text-indigo-400">
    Personal Growth
  </p>

  <!-- Learnings List -->
  <ul class="space-y-6">
    @for (learning of learnings(); track $index) {
      <li class="flex items-start gap-3">
        <lucide-icon
          [img]="CheckCircle"
          [size]="20"
          class="mt-0.5 shrink-0 text-indigo-400"
        />

        <p class="text-sm leading-7 text-zinc-400">
          {{ learning }}
        </p>
      </li>
    }
  </ul>
</section>
