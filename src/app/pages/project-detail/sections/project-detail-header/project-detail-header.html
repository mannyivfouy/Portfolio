<header class="mb-12">
  <!-- Back to Projects -->
  <a
    routerLink="/projects"
    class="cursor-pointer mb-8 inline-flex items-center gap-2 text-sm text-zinc-400 transition hover:text-white"
  >
    <lucide-icon [img]="ArrowLeft" [size]="16" />
    Back to Projects
  </a>

  <!-- Project Title -->
  <h1 class="mb-5 font-heading text-4xl font-bold tracking-tight text-white sm:text-5xl">
    {{ title() }}
  </h1>

  <!-- Project Overview -->
  <p class="max-w-3xl text-base leading-8 text-zinc-400">
    {{ overview() }}
  </p>
</header>
